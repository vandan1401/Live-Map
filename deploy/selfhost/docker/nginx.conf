server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Deployment config, the service worker and the shell must never be served stale: a stale
  # config.js points the app at the wrong backend, a stale sw.js blocks updates.
  location = /config.js { add_header Cache-Control "no-store"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths (e.g. a public colony link) fall back to the shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
