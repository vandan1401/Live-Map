# Builds and publishes the private-instance images when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Pushes ghcr.io/<owner>/naksha-app|naksha-admin|naksha-migrator:<tag>. The SaaS is NOT deployed
# from here: it keeps deploying from `main` through Cloudflare's Git integration, untouched.
# Per the release policy (CONTRIBUTING.md), tag a version for a client only after the change has
# run on the SaaS for a few days. The server pulls these with a read-only (packages: read) token.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: naksha-app
            dockerfile: deploy/selfhost/docker/app.Dockerfile
          - image: naksha-admin
            dockerfile: deploy/selfhost/docker/admin.Dockerfile
          - image: naksha-migrator
            dockerfile: deploy/selfhost/docker/migrator.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.lower }}/${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
