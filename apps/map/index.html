<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Poppins (owner reference, 2026-08-22 map redesign) — used by the canvas renderer's
         plot/feature labels (colonyTheme.ts's MAP_FONT_FAMILY) and set as the app's base
         font below, for one consistent type direction across map and chrome.
         Cinzel — MapLoadingScreen.tsx's wordmark/colony-name only (2026-09-10); every other
         label on that splash reuses Poppins or a system monospace stack rather than pulling
         in the reference design's other three font families. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Cinzel:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#863bff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Colony</title>
    <!-- Generic default for every path this Worker doesn't rewrite (worker/index.ts) — a
         /public/<token> link gets the real colony name + a live layout preview injected
         server-side instead, since WhatsApp/etc. fetch a shared link's HTML directly and
         never run this page's JS. -->
    <meta property="og:title" content="Colony" />
    <meta property="og:description" content="Live plot-status map for the colony." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
