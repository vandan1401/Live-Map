# Hand-written — the Supabase CLI is not installed in the environment that authored this
# file, so this was not generated by `supabase init`. Verify against your local CLI's own
# `supabase init` output before relying on it; regenerate if fields are stale for your
# installed CLI version.
#
# Ports are bumped off the CLI's 54321-54324 defaults (55321-55324) because another local
# project's Supabase stack ("Turf_booking") already holds those on this machine — see
# `docker ps`. Bump further if that collides too.

project_id = "colony-map"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 55322
major_version = 15

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[storage]
# docs/plans/29.md: the colony-backdrops bucket (20260912000000_colony_backdrop_storage.sql)
# is the first real use of Storage in this repo — absent from this hand-written file until
# now, which is why `docker ps` shows no supabase_storage_colony-map container. Served
# through the [api] port's Kong gateway at /storage/v1, no separate port of its own, same as
# every other Supabase CLI project. 50MiB comfortably covers the largest colony backdrop
# this app is expected to ever ship (MAX_BACKDROP_UPLOAD_BYTES in admin-portal/server.ts is
# 15MB) — restart the stack (`supabase stop` then a fresh `db-up`) for this section to take
# effect; an already-running stack started before this section existed will not pick it up.
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
# No public self-registration — an admin-created auth.users row (scripts/create-user.ts)
# *is* the allowlist (D-019, docs/plans/09.md). Deliberately no separate roster table.
enable_signup = false

[auth.email]
# Every account's email is a synthetic, invisible address (D-019) — created
# pre-confirmed via the admin API (email_confirm: true), never sent real mail.
enable_confirmations = false

[auth.sessions]
# Pinned at 24h (docs/plans/09.md, spec/08 criterion 5's "on the order of 24 hours, not
# 30 days"). Verified against the installed CLI (2.114.0) by running `supabase start`
# for real — see this file's own top-of-file disclaimer about verifying against your
# installed CLI.
timebox = "24h"

