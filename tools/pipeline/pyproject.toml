[project]
name = "pipeline"
version = "0.1.0"
description = "Colony Viewer pipeline: site-plan PDF -> SVG + manifest"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "shapely>=2.0",
    # <2.3 pinned: 2.5's bundled __init__.pyi uses PEP 695 `type` statements unconditionally,
    # which fails to parse under this project's pinned mypy python_version = "3.11" (a hard
    # parse error, not a missing-stub warning — surfaced once M10 imported ezdxf, which pulls
    # numpy in transitively; nothing in pipeline/ imports numpy directly yet).
    "numpy>=1.26,<2.3",
    "jsonschema>=4.21",
    "ezdxf>=1.3",
    "flask>=3.0",  # tools/pipeline/ui/server.py -- the owner's local pipeline UI
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-shapely>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipeline"]

[[tool.mypy.overrides]]
module = "pymupdf"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# jsonschema ships no inline types and no stub package is installed here (D-117-adjacent,
# same class of issue as the pymupdf override below) -- tests/test_contract.py already
# imported it unchecked (tests/ isn't in `files` above); pipeline/export/qa.py (M13) is the
# first place it's imported from checked code.
module = "jsonschema"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ezdxf's own __init__.py and ezdxf/entities/__init__.py don't declare `__all__`, so
# strict mode's implicit-reexport check rejects `ezdxf.readfile`/`DXFError`/`DXFGraphic`
# imported the way ezdxf's own docs use them. Same class of issue as the pymupdf override
# below — a third-party package whose public API isn't shaped for strict re-export checking.
module = ["ezdxf", "ezdxf.entities"]
implicit_reexport = true

[[tool.mypy.overrides]]
# pymupdf ships partial/inconsistent stubs (D-117-adjacent: an external C-extension,
# not something this repo controls). io/ is deliberately the one layer allowed to touch
# it directly (tier-2.md, "format code stays at the edge") — relax strictness here only.
module = "pipeline.io.*"
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
