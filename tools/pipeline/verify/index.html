<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Colony verify page</title>
  <!-- Real app stylesheets, not a copy — a plot renders here exactly as it will in
       apps/map, because it is the same CSS (contract §"emitted SVGs carry class/id/
       data-* and nothing else"; this page proves that promise by never adding its own
       colour). See tier-3.md: "the pass/fail distinction is the only thing that matters,
       everything else is quiet." -->
  <link rel="stylesheet" href="../../../apps/map/src/styles/colony-theme.css" />
  <link rel="stylesheet" href="../../../apps/map/src/styles/plot-selection.css" />
  <!-- .texture-road-base / .texture-road-fleck-* / .texture-garden-tint (what verify.js's
       ported pattern defs actually paint) live here, not colony-theme.css — found live:
       roads rendered solid black (unset fill default) without this. -->
  <link rel="stylesheet" href="../../../apps/map/src/styles/map-texture.css" />
  <link rel="stylesheet" href="verify.css" />
</head>
<body>
  <header class="vp-header">
    <label>Colony
      <input id="colony-id" type="text" value="shree-vatika-2" autocomplete="off" />
    </label>
    <button id="load-btn" type="button">Load</button>
    <span id="verified-badge" class="vp-badge"></span>
    <label class="vp-overlay-toggle">
      <input id="overlay-toggle" type="checkbox" disabled />
      Compare to source
    </label>
    <input id="overlay-opacity" type="range" min="0" max="1" step="0.05" value="0.5" disabled />
  </header>

  <div id="fetch-error" class="vp-error" hidden></div>

  <main class="vp-main">
    <div id="svg-stage" class="vp-svg-stage">
      <img id="source-overlay" class="vp-source-overlay" hidden alt="Source plan overlay" />
      <div id="svg-container" class="vp-svg-container"></div>
    </div>

    <aside class="vp-panel">
      <section id="counters" class="vp-counters">
        <h2>Counters</h2>
        <dl id="counter-list"></dl>
      </section>

      <section id="plot-detail" class="vp-plot-detail">
        <h2>Selected plot</h2>
        <p id="plot-detail-empty">Click a plot to inspect it.</p>
        <dl id="plot-detail-list" hidden></dl>
      </section>
    </aside>
  </main>

  <script src="verify.js"></script>
</body>
</html>
